<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0a0a0a; --ink-2:#0d1311; --bone:#f3eee5; --bone-2:#e6e0d3;
    --muted:#7a8a82; --signal:#d68f44; --gold:#e5b94d; --line:#1d2a25;
    --f-display:"Fraunces",serif; --f-mono:"JetBrains Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{
    background:var(--ink);
    font-family:var(--f-display);
    color:var(--bone);
    position:relative;
    overflow:hidden;
  }
  /* soft copper/gold glow, upper-right — echoes the site hero */
  .glow{
    position:absolute; inset:0;
    background:
      radial-gradient(60% 80% at 82% 18%, rgba(229,185,77,.16), transparent 60%),
      radial-gradient(70% 90% at 90% 40%, rgba(214,143,68,.14), transparent 55%);
  }
  /* faint PCB trace grid */
  .grid{
    position:absolute; inset:0; opacity:.05;
    background-image:
      linear-gradient(var(--bone) 1px, transparent 1px),
      linear-gradient(90deg, var(--bone) 1px, transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(75% 75% at 30% 50%, #000 30%, transparent 78%);
  }
  .frame{position:absolute; inset:0; border:1px solid var(--line)}
  .wrap{
    position:relative; height:100%;
    display:flex; flex-direction:column; justify-content:center;
    padding:0 92px;
  }
  .eyebrow{
    font-family:var(--f-mono); font-size:19px; font-weight:500;
    letter-spacing:.32em; text-transform:uppercase; color:var(--muted);
    display:flex; align-items:center; gap:14px; margin-bottom:26px;
  }
  .eyebrow .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
  .word{font-size:132px; font-weight:900; line-height:.92; letter-spacing:-.02em}
  .word .tie{color:var(--signal)}
  .tag{
    font-size:41px; font-weight:400; line-height:1.24; color:var(--bone-2);
    margin-top:30px; max-width:1010px;
  }
  .tag em{font-style:italic; color:var(--gold)}
  .pillars{
    display:flex; gap:34px; margin-top:40px; white-space:nowrap;
    font-family:var(--f-mono); font-size:20px; font-weight:500; color:var(--signal);
  }
  .pillars b{color:var(--bone)} .pillars span{color:var(--muted)}
  .foot{
    position:absolute; left:92px; bottom:52px;
    font-family:var(--f-mono); font-size:21px; letter-spacing:.06em; color:var(--muted);
  }
  .foot b{color:var(--bone)}
  .badge{
    position:absolute; right:92px; bottom:52px;
    font-family:var(--f-mono); font-size:18px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:9px 18px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="frame"></div>
  <div class="wrap">
    <div class="eyebrow"><span class="dot"></span> Local-first · Self-hosted</div>
    <div class="word">Sint<span class="tie">·</span>Bot</div>
    <div class="tag">The group-project AI daemon for Lark &amp; Slack —<br>running on your own machine.</div>
    <div class="pillars">
      <div>① <b>sintbot</b> <span>in Lark / Slack ·</span> <b>Claude Code</b> <span>+</span> <b>Codex</b></div>
      <div>② <b>sintpet</b> <span>on desktop · soon</span></div>
    </div>
  </div>
  <div class="foot"><b>sintbot.com</b></div>
  <div class="badge">Lark · Slack · 16 design styles · local voice</div>
</body>
</html>
