    body{background:#13171c;color:#f6f5f1;min-height:100svh}

    .error-title{display:block;font-size:clamp(30px,5vw,56px);line-height:1.15;margin-top:24px;letter-spacing:-.035em}
    .error-copy{color:#c4c8cc;max-width:580px;font-size:18px;line-height:1.65;margin-top:20px}
    .error-copy[lang]{font-size:16px;margin-top:8px}.error-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}

    .error-links a:first-child{background:#f6f5f1;color:#13171c;border-color:#f6f5f1}
    .error-links a:hover{transform:translateY(-2px)}.error-links a:active{transform:translateY(1px)}
    footer{position:absolute;left:0;right:0;bottom:0;padding-block:24px;border-top:1px solid #ffffff1f;color:#c4c8cc}footer>div{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}footer a{display:inline-flex;min-height:44px;align-items:center;text-decoration:underline;text-underline-offset:5px}
    @media(max-width:500px){.error-links{flex-direction:column}.error-links a{width:100%}.error-wrap{width:calc(100% - 40px)}}
    @media(prefers-reduced-motion:no-preference){.error-content{animation:error-enter .35s ease-out}@keyframes error-enter{from{transform:translateY(8px)}to{transform:translateY(0)}}}
