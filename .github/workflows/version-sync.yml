# 每小时让官网的版本号跟上 npm 上 sintbot 的最新版(scripts/sync-version.mjs --write)。
# 有改动:以 WaterTian 身份提交推 main → 请求 Pages 构建(GITHUB_TOKEN 推的提交不会自己触发构建)
# → 等线上 app.js 显示新版本 → 通知 IndexNow。任何一步失败 = 工作流失败,GitHub 发邮件。
# 发完版不想等整点:gh workflow run version-sync.yml -R WaterTian/sintbot-site
name: Version sync

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: 没有改动也请求一次 Pages 构建并核对线上(验证构建接口用)
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: version-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: sync
        run: node scripts/sync-version.mjs --write
      - name: Commit and push
        if: steps.sync.outputs.changed == '1'
        run: |
          git config user.name WaterTian
          git config user.email 4236326+WaterTian@users.noreply.github.com
          git add app.js index.html zh/index.html llms.txt sitemap.xml install.sh
          git commit -m "官网版本号改为 ${{ steps.sync.outputs.version }}"
          git push origin HEAD:main
      - name: Request a Pages build
        if: steps.sync.outputs.changed == '1' || inputs.rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --jq .status
      - name: Wait until the live site shows the version
        if: steps.sync.outputs.changed == '1' || inputs.rebuild
        run: |
          V="${{ steps.sync.outputs.version }}"
          for i in $(seq 1 40); do
            if curl -fsS --max-time 20 "https://sintbot.com/app.js?v=$(date +%s)" | grep -q "const VERSION = \"$V\";"; then
              echo "线上已是 v$V"; exit 0
            fi
            sleep 30
          done
          echo "20 分钟内线上没显示 v$V"; exit 1
      - name: Notify IndexNow
        if: steps.sync.outputs.changed == '1'
        run: node scripts/indexnow.mjs
